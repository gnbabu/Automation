<div
  #runNowModal
  class="modal fade"
  id="runNowModal"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Run Now</h5>
        <button class="btn-close" (click)="close()"></button>
      </div>

      <div class="modal-body">
        <label class="form-label mb-1">Browser</label>
        <select class="form-select mb-3" [(ngModel)]="browser">
          <option value="Chrome">Chrome</option>
          <option value="Edge">Edge</option>
        </select>

        <ng-container *ngIf="requiresLoginUser">
          <p class="text-muted small">
            This environment requires authentication. Choose which login user this test
            should use.
          </p>

          <label class="form-label mb-1">Login User *</label>
          <select class="form-select" [(ngModel)]="loginUserId">
            <option [ngValue]="null" disabled>Select a login user...</option>
            <option *ngFor="let lu of loginUsers" [ngValue]="lu.loginUserId">
              {{ loginUserLabel(lu) }}
            </option>
          </select>
        </ng-container>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="close()">Cancel</button>
        <button
          class="btn-purple"
          [disabled]="requiresLoginUser && !loginUserId"
          (click)="submit()"
        >
          Run Now
        </button>
      </div>
    </div>
  </div>
</div>
