<div
  #runNowModal
  class="modal fade"
  id="runNowModal"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Select Login User</h5>
        <button class="btn-close" (click)="close()"></button>
      </div>

      <div class="modal-body">
        <p class="text-muted small">
          This environment requires authentication. Choose which login user this test
          should use.
        </p>

        <label class="form-label mb-1">Login User *</label>
        <select class="form-select" [(ngModel)]="loginUserId">
          <option [ngValue]="null" disabled>Select a login user...</option>
          <option *ngFor="let lu of loginUsers" [ngValue]="lu.loginUserId">
            {{ loginUserLabel(lu) }}
          </option>
        </select>

        <div class="mt-2" *ngIf="loginUsers.length === 0">
          <span class="text-danger small">
            You don't have a login credential configured for this environment yet. Add
            one from the Credential Configuration screen first.
          </span>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="close()">Cancel</button>
        <button
          class="btn-purple"
          [disabled]="!loginUserId"
          (click)="submit()"
        >
          Run Now
        </button>
      </div>
    </div>
  </div>
</div>
