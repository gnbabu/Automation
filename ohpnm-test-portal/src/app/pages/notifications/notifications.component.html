<div class="environment-management-container">
  <div class="d-flex justify-content-between align-items-start mb-3">
    <div>
      <h1 class="page-title mb-1">Notifications</h1>
      <small class="text-muted">Release and test execution updates for your account</small>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="unreadOnly"
          [(ngModel)]="unreadOnly"
          (change)="onUnreadOnlyChange()"
        />
        <label class="form-check-label" for="unreadOnly">Unread only</label>
      </div>
      <button class="btn btn-purple" (click)="markAllAsRead()">
        <i class="fas fa-check-double me-1"></i> Mark all as read
      </button>
    </div>
  </div>

  <div class="brand-header-underline mb-4"></div>

  <div *ngIf="loading" class="state-panel text-center py-5">
    <div class="spinner-border text-danger mb-3" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="card section-card" *ngIf="!loading">
    <div class="card-body p-0">
      <app-data-grid
        [columns]="columns"
        [data]="notifications"
        [pagingEnabled]="true"
        [sortingMode]="'client'"
        [noDataMessage]="'No notifications yet'"
      ></app-data-grid>
    </div>
  </div>
</div>

<ng-template #typeTemplate let-row let-value="value">
  <span class="badge" [ngClass]="typePillClass(value)">{{ value }}</span>
</ng-template>

<ng-template #titleTemplate let-row let-value="value">
  <a href="javascript:void(0)" (click)="open(row)" [class.fw-bold]="!row.isRead">{{ value }}</a>
</ng-template>

<ng-template #statusTemplate let-row let-value="value">
  <span class="badge" [ngClass]="value ? 'bg-secondary' : 'badge-unread'">{{ value ? 'Read' : 'Unread' }}</span>
</ng-template>

<ng-template #dateTemplate let-row let-value="value">
  {{ value | date: "dd-MMM-yyyy HH:mm" }}
</ng-template>
