<div class="environment-management-container">
  <!-- Header Section -->
  <div class="header-section d-flex justify-content-between align-items-start mb-3">
    <div>
      <h1 class="mb-1">Recurring Schedules</h1>
      <small class="text-muted">Repeating (Daily/Weekly/Monthly) regression runs for an assignment</small>
    </div>
  </div>

  <div class="brand-header-underline mb-3"></div>

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"></h4>
    <a routerLink="/recurring-schedules/new" class="btn btn-danger">
      <i class="fas fa-plus me-2"></i> Create Recurring Schedule
    </a>
  </div>

  <div *ngIf="loading" class="state-panel text-center py-5">
    <div class="spinner-border text-danger mb-3" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="card section-card" *ngIf="!loading">
    <div class="card-body p-0">
      <app-data-grid
        [columns]="columns"
        [data]="schedules"
        [pagingEnabled]="true"
        [pageSize]="10"
        [sortingMode]="'client'"
        [noDataMessage]="'No recurring schedules yet'"
      ></app-data-grid>
    </div>
  </div>
</div>

<ng-template #nextRunTemplate let-row let-value="value">
  {{ value | date: "dd-MMM-yyyy HH:mm" }}
</ng-template>

<ng-template #lastRunTemplate let-row let-value="value">
  {{ value ? (value | date: "dd-MMM-yyyy HH:mm") : "—" }}
</ng-template>

<ng-template #createdByTemplate let-row let-value="value">
  <span [title]="row.createdOn ? ('Created ' + (row.createdOn | date: 'dd-MMM-yyyy HH:mm')) : ''">
    {{ value || "—" }}
  </span>
</ng-template>

<ng-template #statusTemplate let-row let-value="value">
  <span class="badge" [ngClass]="statusPillClass(value)" [title]="row.pausedReason || ''">
    {{ value ? "Active" : "Paused" }}
  </span>
  <i class="fas fa-info-circle ms-1 text-muted" *ngIf="!value && row.pausedReason" [title]="row.pausedReason"></i>
</ng-template>

<ng-template #actionsTemplate let-row>
  <div class="d-flex gap-1 action-btns">
    <button class="btn btn-sm btn-outline-primary" title="History" (click)="viewHistory(row)">
      <i class="fas fa-history"></i>
    </button>
    <button class="btn btn-sm btn-outline-secondary" title="Edit" (click)="edit(row)">
      <i class="fas fa-pen"></i>
    </button>
    <button class="btn btn-sm btn-outline-secondary" title="Pause" *ngIf="row.isActive" (click)="pause(row)">
      <i class="fas fa-pause"></i>
    </button>
    <button class="btn btn-sm btn-outline-success" title="Resume" *ngIf="!row.isActive" (click)="resume(row)">
      <i class="fas fa-play"></i>
    </button>
    <button class="btn btn-sm btn-outline-danger" title="Delete" (click)="delete(row)">
      <i class="fas fa-trash"></i>
    </button>
  </div>
</ng-template>
