<app-mobile-header (menuToggle)="toggleMobileMenu()"></app-mobile-header>

<div [class.wrapper]="true" [class.collapsed]="isCollapsed">
  <!-- Backdrop behind the off-canvas drawer, mobile-only (see styles.css) - tapping it
       closes the menu the same way picking a nav item does. -->
  <div class="mobile-nav-overlay" *ngIf="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

  <app-left-sidebar
    [isMobileOpen]="isMobileMenuOpen"
    (toggle)="toggleSidebar()"
    (navigate)="closeMobileMenu()"
  ></app-left-sidebar>
  <!-- <app-main></app-main> -->

  <!-- Main Content -->
  <main class="main-content position-relative">
    <div class="container-fluid">
      <app-loading-overlay />
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
<app-confirm-dialog></app-confirm-dialog>
